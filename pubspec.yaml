name: unisharesync_mobile_app
description: "UniShareSync mobile application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  csv: ^6.0.0
  image: ^4.2.0
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.1
  http: ^1.2.0
  file_picker: ^12.0.0-beta.7   # beta required for geolocator win32 compat
  connectivity_plus: ^7.1.1   # latest version in lock file

  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  fl_chart: ^1.2.0
  firebase_core: ^3.13.0        # v3 avoids the PromiseJsImpl web breakage
  firebase_messaging: ^15.2.5   # compatible with firebase_core v3
  flutter_local_notifications: ^18.0.1  # show push notifications in foreground

  permission_handler: ^12.0.3

  perfect_freehand: ^2.0.0
  flutter_sound: ^9.15.0
  path_provider: ^2.1.6
  flutter_riverpod: ^2.5.1
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "lib/assets/icons/UniShareSync.png"
  adaptive_icon_background: "#E8F5E8"
  adaptive_icon_foreground: "lib/assets/icons/UniShareSync.png"

flutter:
  uses-material-design: true
  assets:
    - lib/assets/logos/unisharesync.png
    - 9A Winter 2026 - Central Routine.csv
    - Course Offer Winter 2026 - Course Distribution.csv
