name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Publish APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android APKs (Split per-ABI + Universal)
        run: |
          flutter build apk --split-per-abi --no-tree-shake-icons

      - name: Organize Release Artifacts
        run: |
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/*.apk release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: UniShareSync ${{ github.ref_name }}
          body: |
            ## UniShareSync Mobile App Release ${{ github.ref_name }}
            
            ### Download Options:
            - **`app-arm64-v8a-release.apk`**: Recommended for almost all modern Android phones (64-bit ARM).
            - **`app-armeabi-v7a-release.apk`**: For older 32-bit Android phones.
            - **`app-x86_64-release.apk`**: For Android emulators / x86 tablets.
            
            ### Installation:
            1. Download the appropriate `.apk` for your device.
            2. Tap the downloaded file to install UniShareSync on your Android device.
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
